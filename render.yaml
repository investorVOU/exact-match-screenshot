services:
  - type: web
    name: rush-autos
    runtime: node
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/server/index.mjs
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: META_CONVERSIONS_API_ACCESS_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GA4_PROPERTY_ID
        sync: false
      - key: GOOGLE_ANALYTICS_SERVICE_ACCOUNT_JSON
        sync: false
